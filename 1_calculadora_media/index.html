<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora de Média</title>
</head>

<body>

    <header>
        <h1>Calculadora de Média</h1>
        <p>Th&us</p>
    </header>

    <main>

        <div class="caixa">
            <label for="nota1">Digite a 1° Nota</label>
            <input type="text" id="nota1" class="notas">

            <label for="nota2">Digite a 2° Nota</label>
            <input type="text" id="nota2" class="notas">

            <label for="nota3">Digite a 3° Nota</label>
            <input type="text" id="nota3" class="notas">

            <button id="btn">Calcular</button>

            <p>
                A média das notas é: <strong id="media">-</strong>
            </p>

            <p>
                Situação do aluno: <strong id="situacao">-</strong>
            </p>
        </div>
        <script src="script.js"></script>
    </main>

</body>

</html>
